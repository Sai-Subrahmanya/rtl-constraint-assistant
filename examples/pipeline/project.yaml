schema_version: "1.0"
project:
  name: pipeline
  top: pipeline
sources:
  files:
    - rtl/pipeline.sv
constraints:
  user:
    clocks:
      - name: clk
        period: 8ns
        fixed: true
    io:
      inputs:
        in_data:
          delay: 1.5ns
          clock: clk
        in_valid:
          delay: 1ns
          clock: clk
      outputs:
        out_data:
          delay: 1.5ns
          clock: clk
        out_valid:
          delay: 1ns
          clock: clk
flow:
  backend: generic
optimization:
  enabled: true
  max_iterations: 4
  max_eda_runs: 6
