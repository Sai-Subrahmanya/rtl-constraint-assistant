schema_version: "1.0"
project:
  name: simple_counter
  top: counter
  description: Simple 8-bit counter demonstrator for RCA
sources:
  files:
    - rtl/counter.sv
  include_dirs: []
  defines: []
parameters:
  WIDTH: 8
constraints:
  user:
    clocks:
      - name: clk
        period: 10ns
        fixed: true
    io:
      inputs:
        en:
          delay: 2ns
          clock: clk
      outputs:
        q:
          delay: 2ns
          clock: clk
  existing_sdc: []
analysis:
  language: systemverilog
  safe_mode: balanced
flow:
  backend: generic
  stage: pre_layout_sta
  output_dir: output
optimization:
  enabled: true
  max_iterations: 5
  max_eda_runs: 8
  max_runtime_minutes: 5
  convergence_patience: 3
  priorities:
    timing: high
    area: medium
    power: medium
    timing_margin_utilization: medium
    runtime: low
