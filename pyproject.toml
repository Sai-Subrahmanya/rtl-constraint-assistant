[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-constraint-assistant"
version = "0.1.0"
description = "RTL Constraint Assistant — RTL-aware timing constraint intelligence, SDC generation, validation, and multi-objective optimization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "RCA Project"}
]
keywords = ["VLSI", "EDA", "SDC", "STA", "RTL", "timing", "constraints", "synthesis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pydantic>=2.0",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "pyslang>=11.0",
    "networkx>=3.0",
    "numpy>=1.24",
    "jinja2>=3.1",
    "fastapi>=0.100",
    "uvicorn>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
rca = "rca.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
markers = [
    "optional_real_eda: opt-in test requiring installed real EDA tools and explicit collateral",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# pyslang 11 ships generated .pyi stubs that mypy cannot parse (keyword used as
# an enum attribute name), which aborts the whole run. Keep third-party imports
# as Any so `mypy src/rca` performs a complete, self-contained project check.
no_site_packages = true

[tool.ruff.lint]
# Explicit selection so lint behavior is stable across ruff releases (ruff's
# implicit default set has changed between versions). Error-class pycodestyle,
# pyflakes, import hygiene, and pyupgrade are enforced and kept clean.
select = [
    "E4",  # pycodestyle imports
    "E7",  # pycodestyle statements
    "E9",  # pycodestyle runtime
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernize syntax for requires-python >= 3.10)
]

# ---------------------------------------------------------------------------
# Type-debt ledger (progressive typing)
#
# `mypy src/rca` previously crashed before checking anything: pyslang 11 ships
# generated .pyi stubs that mypy cannot parse, and `no_site_packages = true`
# above exposed ~217 pre-existing annotation errors across these 37 modules
# (much of it fallout from pyslang being untyped). They are enumerated here so
# they are explicit, burnable debt rather than a red command nobody runs.
#
# Rule of thumb: REMOVE a module from this list only when it type-checks
# cleanly; never ADD one. New modules must stay outside this list.
# ---------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = [
    "rca.cli.main",
    "rca.config.model",
    "rca.constraint_model.constraint_set",
    "rca.design_model.design",
    "rca.eda.flow",
    "rca.eda.opensta.backend",
    "rca.eda.yosys.backend",
    "rca.equivalence.normalize",
    "rca.equivalence.semantic_compare",
    "rca.exceptions.analyzer",
    "rca.explanation.generator",
    "rca.inference.engine",
    "rca.inference.io_rules",
    "rca.mcmm.evaluate",
    "rca.optimizer.base",
    "rca.parser.base",
    "rca.parser.expr_walker",
    "rca.parser.slang_adapter",
    "rca.qor.objectives",
    "rca.qor.repository",
    "rca.reports.power",
    "rca.reproducibility.engine",
    "rca.sdc.generation.renderer",
    "rca.sdc.generic.backend",
    "rca.sdc.opensta.backend",
    "rca.sdc.parser",
    "rca.sdc_importer.collections",
    "rca.sdc_importer.normalizer",
    "rca.sdc_importer.parser",
    "rca.sdc_importer.typed_refs",
    "rca.timing_model.timing_graph",
    "rca.validation.backend",
    "rca.validation.conflicts",
    "rca.validation.coverage",
    "rca.validation.references",
    "rca.validation.semantic",
    "rca.web.app",
]
ignore_errors = true
